<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Ceniza cayendo. Las motas NO están en cuadrícula: si se alinean se
       leen como un patrón y deja de ser ceniza.

       **Aligerada.** Eran dieciocho motas apagadas, tres encendidas y dos
       volutas; ahora son diez, dos y una. Lo pidió Eduardo: «el fondo está
       demasiado cargado de elementos y agobia con el tiempo», y ahí está la
       clave — un fondo se mira mil veces, así que lo que en la primera pasada
       es atmósfera en la décima es ruido. Las que se quedaron son las que
       estaban más repartidas: quitar las vecinas es lo que rompe los grumos.

       Las opacidades llevan horneado el peso del mundo, y por eso
       `--m-grano-op` vale 1: ese token no cruza a la app —`app.py` mete el
       grano en `--sup-pagina` como una capa de `background`, y a una capa de
       fondo no se le puede poner opacidad por CSS—. Es la lección de
       Blueprint. Bajaron además de .495 a .34 y de .765 a .5. -->
  <g fill="#8a7566" opacity=".34">
    <circle cx="14" cy="23" r="1.1"/><circle cx="71" cy="38" r="1.2"/>
    <circle cx="131" cy="44" r="1"/><circle cx="26" cy="61" r=".9"/>
    <circle cx="92" cy="66" r=".8"/><circle cx="145" cy="83" r="1"/>
    <circle cx="44" cy="121" r=".9"/><circle cx="117" cy="133" r=".8"/>
    <circle cx="33" cy="148" r="1"/><circle cx="97" cy="141" r="1"/>
  </g>
  <g fill="#ff7a3d" opacity=".5">
    <circle cx="120" cy="28" r="1.3"/><circle cx="38" cy="93" r="1.2"/>
  </g>
  <g stroke="#ff7a3d" stroke-width=".7" opacity=".18" fill="none">
    <path d="M120 28c-2 7-1 13 2 19"/>
  </g>
</svg>
