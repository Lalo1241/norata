<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- La misma ceniza, a plena luz, y en las MISMAS posiciones que la de
       noche: lo que cambia con la luz es de qué color se ve la ceniza, no
       dónde cayó.

       Cambia de signo: sobre carbón la ceniza es lo CLARO, sobre ceniza
       apagada es lo OSCURO —el hollín—. Pintarla clara aquí la borraba.

       Aligerada igual que la de noche —diez motas, dos brasas, una voluta— y
       con las opacidades horneadas más bajas todavía, porque una mota oscura
       sobre papel se ve más que una clara sobre negro. -->
  <g fill="#6b5a4e" opacity=".26">
    <circle cx="14" cy="23" r="1.1"/><circle cx="71" cy="38" r="1.2"/>
    <circle cx="131" cy="44" r="1"/><circle cx="26" cy="61" r=".9"/>
    <circle cx="92" cy="66" r=".8"/><circle cx="145" cy="83" r="1"/>
    <circle cx="44" cy="121" r=".9"/><circle cx="117" cy="133" r=".8"/>
    <circle cx="33" cy="148" r="1"/><circle cx="97" cy="141" r="1"/>
  </g>
  <g fill="#c2440e" opacity=".38">
    <circle cx="120" cy="28" r="1.3"/><circle cx="38" cy="93" r="1.2"/>
  </g>
  <g stroke="#c2440e" stroke-width=".7" opacity=".14" fill="none">
    <path d="M120 28c-2 7-1 13 2 19"/>
  </g>
</svg>
