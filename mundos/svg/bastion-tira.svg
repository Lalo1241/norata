<svg xmlns="http://www.w3.org/2000/svg" width="140" height="14" viewBox="0 0 140 14">
  <!-- Antes esto era una franja de galones de lado a lado y cansaba en diez
       segundos. Ahora es una tira de identificación: la regla de marcas
       calla, y el peligro se concentra en un solo galón a la izquierda. Un
       aviso que está en todas partes deja de ser un aviso. -->
