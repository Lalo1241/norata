  <path d="M0 13.4h140" stroke="#05070a" stroke-width="1.2"/>
  <g fill="#ffc233"><path d="M4 2h7l-5 5 5 5H4z"/></g>
  <g stroke="#5f7181" stroke-width="1">
    <path d="M20 4v6M28 5.5v3M36 5.5v3M44 5.5v3M52 4v6M60 5.5v3M68 5.5v3M76 5.5v3M84 4v6"/>
  </g>
  <g stroke="#4db8ff" stroke-width="1.4" opacity=".85"><path d="M96 4v6M100 6v2"/></g>
  <g fill="#5f7181"><rect x="118" y="6" width="16" height="2"/></g>
</svg>
