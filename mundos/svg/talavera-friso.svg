    <path d="M31 31c-6.2.9-11.5 5.3-11.9 11.1-.3 3.5 3.1 5.3 4.9 3.1 1.8-2.2-.4-4.9-3.1-3.6"/>
    <path d="M31 31c6.2.9 11.5 5.3 11.9 11.1.3 3.5-3.1 5.3-4.9 3.1-1.8-2.2.4-4.9 3.1-3.6"/>
  </g>
  <g fill="#1e3f8f" fill-opacity=".18" stroke="#1e3f8f" stroke-width="1.7" stroke-linejoin="round">
    <path id="tf-p" d="M31 31C26.6 26.6 23.1 19.5 27.5 13.3 29.3 10.7 32.7 10.7 34.5 13.3 38.9 19.5 35.4 26.6 31 31Z"/>
    <use href="#tf-p" transform="rotate(60 31 31)"/><use href="#tf-p" transform="rotate(120 31 31)"/>
    <use href="#tf-p" transform="rotate(180 31 31)"/><use href="#tf-p" transform="rotate(240 31 31)"/>
    <use href="#tf-p" transform="rotate(300 31 31)"/>
  </g>
  <circle cx="31" cy="31" r="4.6" fill="#f7f4ec" stroke="#1e3f8f" stroke-width="1.7"/>
  <circle cx="31" cy="31" r="1.7" fill="#1e3f8f"/>
</svg>
