<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <!-- Una piedra en su montura, y el nombre no es mío: la app ya llama
       «piedra» a la insignia de Fundador en el código de js/10d-plan.js. El
       mundo hereda ese dibujo en vez de inventar otro, así que el distintivo
       que ya se prometió y el mundo que lo sustituye hablan de lo mismo.
       Una reliquia es una piedra GUARDADA — por eso importa tanto la montura
       como la piedra. -->
  <defs>
    <linearGradient id="rq-p" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#d9c9f5"/><stop offset=".55" stop-color="#b7a2ea"/>
      <stop offset="1" stop-color="#6f5aa8"/>
    </linearGradient>
    <linearGradient id="rq-m" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#e0c072"/><stop offset=".45" stop-color="#a2803a"/>
      <stop offset="1" stop-color="#6b5326"/>
    </linearGradient>
  </defs>
  <!-- la montura: plato con los cuatro dientes que sujetan -->
  <path d="M14 2.6 24.4 8.6v10.8L14 25.4 3.6 19.4V8.6z" fill="none" stroke="url(#rq-m)" stroke-width="1.7" stroke-linejoin="round"/>
  <g stroke="url(#rq-m)" stroke-width="1.5" stroke-linecap="round">
    <path d="M8.2 9.4 6.4 8M19.8 9.4 21.6 8M8.2 18.6 6.4 20M19.8 18.6 21.6 20"/>
  </g>
  <!-- el cabujón: bombeado, no facetado. Una reliquia se pule, no se talla -->
  <ellipse cx="14" cy="14" rx="5.4" ry="6.2" fill="url(#rq-p)"/>
  <path d="M11.4 10.4c1-1.2 2.4-1.8 3.6-1.5-.8 1.1-1.9 2-3.6 2.6z" fill="#f2ecff" opacity=".85"/>
  <ellipse cx="14" cy="14" rx="5.4" ry="6.2" fill="none" stroke="#4a3a72" stroke-width=".9"/>
</svg>
