<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <defs>
    <!-- Un pétalo con punta y cintura, no una lenteja: la curva entra,
         se estrecha y sale. Es lo que separa una flor pintada a mano
         de un diagrama. -->
    <path id="petalo" d="M70 70 C60 60 52 44 62 30 C66 24 74 24 78 30 C88 44 80 60 70 70 Z"/>
    <path id="nervio" d="M70 66 C68 54 68 42 70 33"/>
    <!-- Un zarcillo que gira sobre sí mismo -->
    <path id="rizo" d="M70 70 C84 68 96 58 97 45 C97.6 37 90 33 86 38 C82 43 87 49 93 46"/>
    <path id="hoja" d="M70 70 C79 72 88 79 89 88 C89.6 93 84 95 81 91 C77 86 74 78 70 70 Z"/>
  </defs>

  <!-- La opacidad va AQUÍ y no en --m-grano-op, que es una sola para todas las
       capas: bajándola allí se apagaba también la greca de los filos, que
       ocupa poca área y necesita verse. Medido: con el campo a plena tinta el
       fondo de Talavera daba 2,70 de contraste en el percentil 90, el doble
       que cualquier otro mundo. Eso era el empacho, en número. -->
  <g id="campo" opacity="0.6">

  <g fill="none" stroke="#1e3f8f" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <use href="#rizo"/><use href="#rizo" transform="rotate(90 70 70)"/>
    <use href="#rizo" transform="rotate(180 70 70)"/><use href="#rizo" transform="rotate(270 70 70)"/>
  </g>

  <g fill="#1e3f8f" fill-opacity=".16" stroke="#1e3f8f" stroke-width="2.3" stroke-linejoin="round">
    <use href="#petalo"/><use href="#petalo" transform="rotate(45 70 70)"/>
    <use href="#petalo" transform="rotate(90 70 70)"/><use href="#petalo" transform="rotate(135 70 70)"/>
    <use href="#petalo" transform="rotate(180 70 70)"/><use href="#petalo" transform="rotate(225 70 70)"/>
    <use href="#petalo" transform="rotate(270 70 70)"/><use href="#petalo" transform="rotate(315 70 70)"/>
  </g>

  <g fill="none" stroke="#1e3f8f" stroke-width="1.1" stroke-linecap="round" opacity=".85">
    <use href="#nervio"/><use href="#nervio" transform="rotate(45 70 70)"/>
    <use href="#nervio" transform="rotate(90 70 70)"/><use href="#nervio" transform="rotate(135 70 70)"/>
    <use href="#nervio" transform="rotate(180 70 70)"/><use href="#nervio" transform="rotate(225 70 70)"/>
    <use href="#nervio" transform="rotate(270 70 70)"/><use href="#nervio" transform="rotate(315 70 70)"/>
  </g>

  <circle cx="70" cy="70" r="7.5" fill="#faf6ec" stroke="#1e3f8f" stroke-width="2.3"/>
  <circle cx="70" cy="70" r="2.6" fill="#1e3f8f"/>

  <!-- Cuartos de flor en las esquinas, para que el azulejo case consigo mismo -->
  <g fill="#1e3f8f" fill-opacity=".14" stroke="#1e3f8f" stroke-width="2.1" stroke-linejoin="round">
    <use href="#hoja" transform="translate(-70 -70)"/>
    <use href="#hoja" transform="translate(70 -70) rotate(90 70 70)"/>
    <use href="#hoja" transform="translate(-70 70) rotate(270 70 70)"/>
    <use href="#hoja" transform="translate(70 70) rotate(180 70 70)"/>
  </g>
  </g>
</svg>
