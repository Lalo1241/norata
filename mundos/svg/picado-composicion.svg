<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240">
  <!-- El mosaico anterior no casaba: el cordel salía por la derecha a una
       altura y volvía a entrar por la izquierda a otra, así que en la costura
       quedaba un escalón y un hueco. Aquí los dos cordeles empiezan y acaban
       a la MISMA altura, y la hoja que cruza el borde está dibujada dos veces
       -saliendo por la derecha y entrando por la izquierda- para que no se
       vea dónde termina el patrón. -->
  <path d="M0 22C60 36 120 38 180 30 240 22 300 34 360 22" fill="none" stroke="#c9b8a0" stroke-width="1"/>
  <path d="M0 146C70 160 140 158 210 150 280 142 320 154 360 146" fill="none" stroke="#c9b8a0" stroke-width="1" opacity=".85"/>

  <g opacity=".5">
    <path d="M30 30h54v44l-6-6-6 6-6-6-6 6-6-6-6 6-6-6-6 6z" fill="#e6187c"/>
    <g fill="#f5eee1"><circle cx="57" cy="44" r="6"/><path d="M44 56h26v3H44z"/><circle cx="44" cy="48" r="2.4"/><circle cx="70" cy="48" r="2.4"/></g>
  </g>
  <g opacity=".42">
    <path d="M140 32h40v32l-5-4-5 4-5-4-5 4-5-4-5 4-5-4-5 4z" fill="#2aa9a0"/>
    <g fill="#f5eee1"><path d="M160 38l7 8-7 8-7-8z"/><circle cx="160" cy="58" r="2"/></g>
  </g>
  <g opacity=".46">
    <path d="M238 28h62v50l-7-6-7 6-7-6-7 6-7-6-7 6-7-6-6 6z" fill="#f2a516"/>
    <g fill="#f5eee1"><path d="M256 42a13 13 0 0 0 26 0z"/><circle cx="269" cy="62" r="4"/><circle cx="252" cy="56" r="2.2"/><circle cx="286" cy="56" r="2.2"/></g>
  </g>
  <!-- La que cruza la costura: misma hoja, dibujada a los dos lados -->
  <g opacity=".44">
    <path d="M336 24h48v42l-6-5-6 5-6-5-6 5-6-5-6 5-6-5-6 5z" fill="#6d3fb8"/>
    <path d="M-24 24h48v42l-6-5-6 5-6-5-6 5-6-5-6 5-6-5-6 5z" fill="#6d3fb8"/>
    <g fill="#f5eee1"><circle cx="360" cy="40" r="5.5"/><circle cx="0" cy="40" r="5.5"/></g>
  </g>

  <g opacity=".4">
    <path d="M74 154h46v38l-6-5-5 5-6-5-5 5-6-5-5 5-6-5-7 5z" fill="#6d3fb8"/>
    <g fill="#f5eee1"><circle cx="97" cy="168" r="5.5"/><path d="M86 180h22v3H86z"/></g>
  </g>
  <g opacity=".44">
    <path d="M206 152h56v44l-7-6-6 6-7-6-6 6-7-6-6 6-7-6-10 6z" fill="#e6187c"/>
    <g fill="#f5eee1"><path d="M234 162l8 9-8 9-8-9z"/><circle cx="219" cy="170" r="2.6"/><circle cx="249" cy="170" r="2.6"/></g>
  </g>
  <g opacity=".38">
    <path d="M300 150h40v30l-5-4-5 4-5-4-5 4-5-4-5 4-5-4-5 4z" fill="#2aa9a0"/>
    <g fill="#f5eee1"><circle cx="320" cy="164" r="4.5"/></g>
  </g>
</svg>
