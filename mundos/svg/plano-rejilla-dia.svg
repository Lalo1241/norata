<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- La misma retícula de la noche, invertida: en una copia heliográfica el
       papel es claro y la línea es azul, no al revés. Los dos pesos y las
       cruces de registro no se tocan —son lo que distingue un plano de una
       hoja cuadriculada— y las opacidades tampoco: lo único que cambia es el
       tono de la tinta. -->
