    <g stroke-width=".5" opacity=".26">
      <path d="M8 0v80M16 0v80M24 0v80M32 0v80M48 0v80M56 0v80M64 0v80M72 0v80"/>
      <path d="M0 8h80M0 16h80M0 24h80M0 32h80M0 48h80M0 56h80M0 64h80M0 72h80"/>
    </g>
    <g stroke-width=".9" opacity=".5"><path d="M40 0v80M0 40h80M0 0h80M0 0v80"/></g>
    <g stroke-width="1.1" opacity=".75"><path d="M36 40h8M40 36v8M-4 0h8M0 -4v8"/></g>
  </g>
</svg>
