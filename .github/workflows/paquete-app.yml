# ============================================================
#  El paquete de la app de Android
# ============================================================
#
#  La app nativa (Capacitor, fuera de este repositorio) no carga
#  mi.norata.app: lleva los archivos DENTRO, para abrir sin red y sin
#  pasar por Chrome. Eso tiene una consecuencia: una versión nueva ya no
#  llega sola publicando, como en la web. Llega porque la app, al abrirse,
#  mira aquí si hay un paquete más nuevo, lo baja por detrás y lo estrena
#  en la siguiente apertura.
#
#  Este trabajo es el que fabrica ese paquete, y corre SOLO al subir la
#  versión: se dispara con cualquier cambio en `js/01-base.js` y se sale
#  si ya hay un paquete con ese número. Así nadie tiene que acordarse de
#  nada — la regla de siempre (subir VERSION y CACHE) basta.
#
#  Va a GitHub Releases y no a la web por dos razones: la web se publica
#  con Jekyll desde la rama y meter aquí un .zip por versión llenaría el
#  historial del repositorio para siempre; y un release lo puede crear
#  este trabajo con su propia llave (`github.token`), sin guardar ningún
#  secreto en ningún lado.
#
#  Lo que la app lee:
#    https://github.com/Lalo1241/norata/releases/latest/download/ultima.json

name: Paquete de la app

on:
  push:
    branches: [main]
    paths:
      - js/01-base.js
      - .github/workflows/paquete-app.yml
  workflow_dispatch:

permissions:
  contents: write

# Dos publicaciones seguidas no pueden pisarse el `latest`.
concurrency:
  group: paquete-app
  cancel-in-progress: false

jobs:
  paquete:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Leer la versión
        id: v
        run: |
          V=$(sed -n 's/^const VERSION = "\(.*\)";.*/\1/p' js/01-base.js)
          C=$(sed -n 's/^const CACHE = "norata-\(.*\)";.*/\1/p' sw.js)
          echo "VERSION=$V  CACHE=$C"
          # Un paquete con los dos números distintos es una publicación a
          # medias; mejor no fabricarlo que mandarlo a los teléfonos.
          if [ -z "$V" ] || [ "$V" != "$C" ]; then
            echo "::error::VERSION ($V) y CACHE ($C) no coinciden"; exit 1
          fi
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if gh release view "app-$V" >/dev/null 2>&1; then
            echo "Ya existe el paquete app-$V: nada que hacer."
            echo "ya=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Armar el paquete
        if: steps.v.outputs.ya != '1'
        run: |
          V="${{ steps.v.outputs.v }}"
          mkdir -p dist/marca dist/caminos
          cp -r index.html manifest.webmanifest login crear-cuenta privacidad terminos \
                css js icon.svg favicon.svg icon-192.png icon-512.png \
                icon-maskable-512.png apple-touch-icon.png dist/
          cp marca/*.svg dist/marca/
          # `caminos.json` se pide en caliente; su generador no viaja.
          cp caminos/caminos.json dist/caminos/

          # Todo lo que la web instala (el ASSETS de sw.js) tiene que estar
          # dentro. Se lee de sw.js y no se copia, para que un archivo nuevo
          # que se registre allí no pueda faltar aquí sin que esto falle.
          falta=0
          for u in $(grep -o '"\./[^"]*"' sw.js | tr -d '"' | sed 's#^\./##'); do
            [ -z "$u" ] && continue
            case "$u" in */) u="${u}index.html";; esac
            if [ ! -f "dist/$u" ]; then echo "::error::falta en el paquete: $u"; falta=1; fi
          done
          [ "$falta" = 0 ] || exit 1

          (cd dist && zip -qr "../norata-$V.zip" .)
          SHA=$(sha256sum "norata-$V.zip" | cut -d' ' -f1)
          URL="https://github.com/${{ github.repository }}/releases/download/app-$V/norata-$V.zip"
          printf '{"version":"%s","url":"%s","sha256":"%s"}\n' "$V" "$URL" "$SHA" > ultima.json
          cat ultima.json
          ls -l "norata-$V.zip"

      - name: Publicar el paquete
        if: steps.v.outputs.ya != '1'
        run: |
          V="${{ steps.v.outputs.v }}"
          gh release create "app-$V" "norata-$V.zip" ultima.json \
            --title "Norata $V (app)" \
            --notes "Paquete de la app de Android para la versión $V. Lo fabrica .github/workflows/paquete-app.yml; la app lo baja sola." \
            --target "${{ github.sha }}" --latest

      # Se guardan los últimos quince: de sobra para volver atrás, y sin
      # dejar crecer la lista para siempre.
      - name: Retirar paquetes viejos
        if: steps.v.outputs.ya != '1'
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("app-"))] | sort_by(.createdAt) | reverse | .[15:] | .[].tagName' |
          while read -r t; do
            [ -n "$t" ] && gh release delete "$t" --yes --cleanup-tag
          done
