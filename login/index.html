<!-- ============ NI DENTRO DE UN MARCO AJENO (0.7.139) ============
     Medido: la app se dejaba meter en un `<iframe>` de cualquier sitio, sin
     una queja. Eso es clickjacking — otro pone Norata invisible debajo de su
     propia página y te hace pulsar lo que él quiera: «borrar todos mis
     datos», «cerrar sesión», o mañana un botón de pagar.

     **Por qué no se arregla con la CSP.** `frame-ancestors` es la directiva
     que existe justo para esto, y es de las que **el navegador IGNORA dentro
     de un `<meta>`**: solo vale como cabecera HTTP. GitHub Pages no deja
     poner cabeceras. Así que aquí, hoy, la CSP no puede cerrar esta puerta
     por mucho que se le escriba la línea — quedaría puesta y sin efecto, que
     es peor que no tenerla.

     **Y por qué se esconde con CSS en vez de saltar fuera del marco.** El
     truco de toda la vida es `top.location = self.location`, y los
     navegadores modernos lo BLOQUEAN desde un marco de otro origen si no ha
     habido un gesto de la persona — o sea, justo en el caso que importa. Se
     intenta igual porque cuando funciona es la mejor salida, pero lo que de
     verdad protege es lo de abajo: la página nace escondida y solo se enseña
     si NO está dentro de un marco. Eso no hay manera de bloquearlo.

     **El modo de fallo, que es lo que hay que mirar antes de meter esto.** Si
     este script no corriera, la página se quedaría en blanco. No añade un
     riesgo nuevo: sin JavaScript esta app no pinta nada de todos modos —la
     puerta no dibuja ni el formulario y la app se queda en la pantalla de
     carga—, y el `<noscript>` de abajo devuelve el comportamiento de siempre
     a quien lo tenga apagado. El script en sí no puede reventar: `self`,
     `top` y `documentElement` existen siempre y no toca nada más.

     Va ARRIBA DEL TODO, antes de las hojas de estilo, porque lo que se quiere
     evitar es que se llegue a ver un fotograma. -->
<style>html { display: none }</style>
<noscript><style>html { display: block }</style></noscript>
<script>
  if (self === top) document.documentElement.style.display = "block";
  else { try { top.location = self.location; } catch (e) { /* el navegador lo bloquea desde otro origen */ } }
</script>
</head>
<body>
<script>
  /* El modo claro, antes de pintar nada. Si esperara al script principal, cada
     carga empezaría de noche y daría un fogonazo oscuro antes de aclararse.
     Es la misma llave que usa la app: la preferencia es del dispositivo y esta
     pantalla vive en el mismo origen, así que se comparte sola. */
  try {
    if (localStorage.getItem("norata-tema") === "claro") {
      document.documentElement.classList.add("claro");
      /* El MISMO valor que `--bg` en `html.claro`, no uno parecido: es lo que
         el navegador lee al abrir, y si no coincide con lo que se pinta debajo
         se ve un escalón en el borde de arriba. Decía `#f2f4f8`, que es el
         fondo de los CORREOS y no el de la app. */
      var mtc = document.querySelector('meta[name="theme-color"]');
      if (mtc) mtc.setAttribute("content", "#dcdef0");
    }
  } catch (e) {}
</script>

<!-- ============ LA RED DE SEGURIDAD DE LA PUERTA (0.7.138) ============
     La app tiene una desde siempre (ver el mismo bloque en `index.html`); la
     puerta no tenía ninguna, y es al revés de lo que parece: **el botón del
     bicho vive DENTRO**, así que quien se queda fuera por un error de esta
     pantalla es justo quien no tiene forma de avisar de que se quedó fuera.
     Un fallo aquí era invisible para todos.

     Corre ANTES de los ocho archivos y sin depender de ninguno, por lo mismo
     que en la app: una red que dependiera de lo que falló, fallaría con ello.
     De ahí los `var`, el `try` alrededor de todo y los colores escritos a
     mano — aquí no se puede suponer que `css/estilos.css` haya llegado.

     Tres diferencias con la de la app, y ninguna es de estilo:

       - **No ofrece guardar un respaldo.** Aquí no hay nada guardado de esta
         sesión: lo que se pueda salvar está del otro lado y se salva entrando.
         Un botón que descargara un archivo vacío sería peor que no tenerlo.
       - **El aviso dice qué hacer para ENTRAR**, que es lo único que se venía
         a hacer, y nombra el correo como salida cuando recargar no baste.
       - **La cola la vacía `12-login.js`**, no el arranque de la app: es el
         único que corre aquí. `sbVaciarTropiezos()` sale de `10b-supabase.js`
         y no necesita sesión a propósito (ver su nota), que es exactamente el
         caso de esta pantalla. -->
<script>
  (function () {
    try {
      var yaAvisado = false;

      /* La lista la lee `sbVaciarTropiezos()` cuando ya hay con qué mandarla.
         Mismo nombre que en la app porque es la MISMA función la que la
         recoge; cambiarlo aquí obligaría a mantener dos. */
      window.__tropiezos = [];
      function apuntar(donde, mensaje) {
        try {
          /* Tope de diez, igual que en la app: un error dentro de un bucle
             dispara miles en un segundo. */
          if (window.__tropiezos.length >= 10) return;
          window.__tropiezos.push({ donde: donde, mensaje: String(mensaje).slice(0, 300) });
        } catch (e) { /* ni aquí se puede fallar */ }
      }

      /* La pantalla de carga tapa la puerta entera, así que si el arranque
         muere a medias tiene que irse igualmente: una carga eterna se ve igual
         que una puerta rota, pero sin el aviso que explica qué pasó. El plazo
         cubre además el caso sin error ninguno — una petición que no contesta
         ni falla, que en esta pantalla es el fallo más probable de todos. */
      function destapar() {
        var c = document.getElementById("carga");
        if (c) c.className = "carga oculta";
      }
      setTimeout(destapar, 15000);

      function avisar(detalle) {
        if (yaAvisado || !document.body) return;
        yaAvisado = true;
        var BOTON = "border:0;border-radius:10px;padding:9px 14px;font:600 13px system-ui,sans-serif;cursor:pointer";
        var caja = document.createElement("div");
        caja.setAttribute("style",
          "position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#1a1219;" +
          "border-top:2px solid #ff8a70;color:#f7f8fa;padding:16px 18px;" +
          "font:14px/1.5 system-ui,-apple-system,sans-serif;box-shadow:0 -8px 24px rgba(0,0,0,.45)");
        caja.innerHTML =
          '<b style="color:#ff8a70">Algo falló al abrir la pantalla de entrar.</b><br>' +
          'Tu cuenta y tu progreso no se han tocado. Vuelve a cargar; si sigue igual, ' +
          'entra desde el enlace del correo que te mandamos.' +
          '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' +
            '<button data-a="rl" style="' + BOTON + ';background:#5fe0b0;color:#10151d">Volver a cargar</button>' +
            '<button data-a="cl" style="' + BOTON + ';background:transparent;color:#8b93a1">Ocultar</button>' +
          '</div>';

        /* El detalle técnico va con textContent y no dentro del innerHTML: el
           mensaje de un error puede traer cualquier cosa, incluso algo que
           parezca HTML. */
        var pie = document.createElement("div");
        pie.setAttribute("style", "margin-top:10px;font-size:11.5px;color:#8b93a1;word-break:break-word");
        pie.textContent = detalle || "";
        caja.appendChild(pie);

        caja.addEventListener("click", function (ev) {
          var a = ev.target && ev.target.getAttribute && ev.target.getAttribute("data-a");
          if (a === "rl") location.reload();
          else if (a === "cl") caja.remove();
        });

        document.body.appendChild(caja);
        destapar();
      }

      window.onerror = function (msg, url, linea) {
        var texto = String(msg) + (linea ? " (linea " + linea + ")" : "");
        apuntar("puerta", texto);
        avisar(texto);
      };
      /* Y las promesas, que en ESTA pantalla son casi todo: entrar, crear la
         cuenta, volver de Google y recoger la sesión del enlace del correo son
         cuatro `async` y ninguna la mira `window.onerror`. */
      window.addEventListener("unhandledrejection", function (ev) {
        var r = ev && ev.reason;
        var texto = (r && r.message) ? r.message : String(r);
        apuntar("puerta-promesa", texto);
        avisar(texto);
      });
    } catch (e) { /* una red que reviente deja la puerta peor que sin red */ }
  })();
</script>

<!-- ============ IDIOMA Y ASPECTO, EN LA PUERTA (0.7.117) ============
     Hasta ahora la puerta hablaba SIEMPRE en español a quien nunca ha

     pantalla donde se elige está al otro lado». El problema es que al otro
     lado hay que crear una cuenta, y quien no entiende la puerta no la crea.

     Lo que lo hace posible sin tocar nada más es que el idioma ya vive en DOS
     sitios: el dato (`state.settings.idioma`, que viaja con la cuenta) y el
     espejo de `localStorage`, que existe justo para saberlo antes de que haya
     datos de nadie. La puerta escribe el espejo; el perfil que se cree después
     nace con ese idioma puesto (ver la normalización de `js/01-base.js`).

     Lo pinta `js/12-login.js` porque los dos discos salen de `discoIdioma()`,
     que es el mismo aro que usan Ajustes y la pantalla de la primera vez.

     Y al lado, el sol y la luna: la puerta LEÍA el modo claro desde la primera
     versión —el script de arriba— pero no dejaba cambiarlo, así que quien
     abriera de día se comía la pantalla de noche hasta estar dentro. Los dos
     van juntos abajo a la izquierda porque son la misma clase de cosa: cómo te
     habla la app, decidido antes de entrar. -->
