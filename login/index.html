<!DOCTYPE html>
<!-- `class="puerta"` no es decorativa: es lo que ESCOPA las reglas de la
     puerta en `css/estilos.css`. Sin ella, `.portada { right: 60% }` se
     aplicaba también dentro de la app y el login tapaba media pantalla. -->
<html lang="es" class="puerta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10151d">
<meta name="color-scheme" content="dark light">
<!-- La misma muralla que la app. `connect-src` es lo que de verdad aporta:
     aunque algún día se colara código ajeno, solo podría hablar con este sitio
     y con nuestro servidor — y esta página maneja contraseñas, así que aquí
     importa incluso más que en el resto. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  font-src 'self' data:;
  connect-src 'self' https://wifffghnyrqfuwqlatci.supabase.co;
  form-action 'self';
  base-uri 'none';
  object-src 'none'">
<title>Entrar · Norata</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Norata">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Sin `manifest` a propósito: el que se instala es la app, no la puerta. Con
     el manifest aquí, quien instalara desde esta pantalla se llevaría un acceso
     directo que abre el login para siempre, incluso con la sesión ya puesta. -->
<link rel="stylesheet" href="../css/fuente.css">
<link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
<script>
  /* El modo claro, antes de pintar nada. Si esperara al script principal, cada
     carga empezaría de noche y daría un fogonazo oscuro antes de aclararse.
     Es la misma llave que usa la app: la preferencia es del dispositivo y esta
     pantalla vive en el mismo origen, así que se comparte sola. */
  try {
    if (localStorage.getItem("norata-tema") === "claro") {
      document.documentElement.classList.add("claro");
      /* El MISMO valor que `--bg` en `html.claro`, no uno parecido: es lo que
         el navegador lee al abrir, y si no coincide con lo que se pinta debajo
         se ve un escalón en el borde de arriba. Decía `#f2f4f8`, que es el
         fondo de los CORREOS y no el de la app. */
      var mtc = document.querySelector('meta[name="theme-color"]');
      if (mtc) mtc.setAttribute("content", "#dcdef0");
    }
  } catch (e) {}
</script>

<!-- Los tres huecos que la portada necesita para hablar: la pantalla de
     esperar, el cuadro de confirmar y los avisos de abajo. Son los mismos
     ids que en la app porque los usan las MISMAS funciones de `01-base.js`;
     cambiarlos aquí obligaría a mantener dos versiones de cada una. -->
<div class="carga" id="carga" role="status" aria-live="polite">
  <div class="carga-marca">
    <span class="carga-anillo"></span>
    <svg viewBox="0 0 250 250" aria-hidden="true"><path d="M224.919,110.004h-5.319c-2.476,0-4.487-2.011-4.487-4.487V25.081c0-4.947-4.027-8.973-8.973-8.973h-87.162c-4.947,0-8.973,4.027-8.973,8.973v5.319c0,2.476-2.011,4.487-4.487,4.487H31.811c-8.658,0-15.703,7.046-15.703,15.703v80.436c0,4.947,4.027,8.973,8.973,8.973h5.319c2.476,0,4.487,2.011,4.487,4.487v80.432c0,4.947,4.027,8.973,8.973,8.973h87.166c4.947,0,8.973-4.027,8.973-8.973v-5.319c0-2.476,2.011-4.487,4.487-4.487h55.755c18.556,0,33.65-15.094,33.65-33.65v-62.485c0-4.947-4.027-8.973-8.973-8.973ZM55.91,128.783h-5.319c-2.476,0-4.487-2.011-4.487-4.487v-54.927c0-2.476,2.011-4.487,4.487-4.487h61.657c4.947,0,8.973-4.027,8.973-8.973v-5.319c0-2.476,2.011-4.487,4.487-4.487h54.923c2.476,0,4.487,2.011,4.487,4.487v61.657c0,4.947,4.027,8.973,8.973,8.973h5.319c2.476,0,4.487,2.011,4.487,4.487v45.949c0,7.422-6.038,13.46-13.46,13.46h-52.679c-4.947,0-8.973,4.027-8.973,8.973v5.319c0,2.476-2.011,4.487-4.487,4.487h-54.927c-2.476,0-4.487-2.011-4.487-4.487v-61.653c0-4.947-4.027-8.973-8.973-8.973Z"/></svg>
  </div>
  <p class="carga-msg" id="carga-msg">Abriendo Norata…</p>
</div>

<!-- Las tres luces de fondo. Son lo que hace que esta pantalla se reconozca
     como Norata antes de leer nada. -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="modal-backdrop" id="modal" onclick="modalClicFuera(event, this)">
  <div class="modal-card">
    <div class="modal-ic" id="modal-ic" hidden></div>
    <h3 class="modal-titulo" id="modal-titulo" hidden></h3>
    <p id="modal-msg"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modal-cancel" onclick="modalDone(false)">Cancelar</button>
      <button class="btn btn-primary" id="modal-ok" onclick="modalDone(true)">Confirmar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- ============ IDIOMA Y ASPECTO, EN LA PUERTA (0.7.117) ============
     Hasta ahora la puerta hablaba SIEMPRE en español a quien nunca ha
     entrado, y estaba escrito así a conciencia: «todavía no ha elegido, y la
     pantalla donde se elige está al otro lado». El problema es que al otro
     lado hay que crear una cuenta, y quien no entiende la puerta no la crea.

     Lo que lo hace posible sin tocar nada más es que el idioma ya vive en DOS
     sitios: el dato (`state.settings.idioma`, que viaja con la cuenta) y el
     espejo de `localStorage`, que existe justo para saberlo antes de que haya
     datos de nadie. La puerta escribe el espejo; el perfil que se cree después
     nace con ese idioma puesto (ver la normalización de `js/01-base.js`).

     Lo pinta `js/12-login.js` porque los dos discos salen de `discoIdioma()`,
     que es el mismo aro que usan Ajustes y la pantalla de la primera vez.

     Y al lado, el sol y la luna: la puerta LEÍA el modo claro desde la primera
     versión —el script de arriba— pero no dejaba cambiarlo, así que quien
     abriera de día se comía la pantalla de noche hasta estar dentro. Los dos
     van juntos abajo a la izquierda porque son la misma clase de cosa: cómo te
     habla la app, decidido antes de entrar. -->
<!-- ============ LA MARCA, EN LA ESQUINA (0.7.123) ============
     Fuera de la tarjeta y quieta, como la de Supabase. Dentro crecía y se
     encogía con la pantalla y empujaba el título a una altura distinta en cada
     una de las dos pantallas; aquí no se mueve, y nada de lo de abajo depende
     de su alto.

     Sin `src`: lo pone `pintarTema()` —que ya recorre todos los
     `.portada-logo`— porque es quien sabe cuál de los dos archivos toca. Con
     uno escrito aquí, en modo claro se vería el logotipo equivocado un
     fotograma. Su hueco está reservado en el CSS, así que la esquina no salta
     cuando llega. -->
<div class="puerta-marca">
  <img class="portada-logo" alt="Norata">
</div>

<div class="puerta-ajustes" id="puerta-ajustes">
  <div class="puerta-idioma" id="puerta-idioma" role="group" aria-label="Idioma"></div>
  <!-- El sol y la luna son EL MISMO control de Ajustes (`temaSwitchHTML`), no
       una copia: se pega en un `.tema-hueco` y `pintarTema()` lo rellena y lo
       vuelve a marcar solo al cambiar de modo — que además es quien cambia el
       archivo del logotipo, porque el claro va sobre fondo oscuro. Dos
       maquetaciones para lo mismo es como una de las dos se queda sin
       arreglar; aquí solo se le quitan el rótulo y las palabras con CSS. -->
  <div class="tema-hueco"></div>
</div>

<!-- ============ EL PANEL DE AL LADO (0.7.117) ============
     Vive aquí y no en `js/10c-portada.js`
     a propósito: ese archivo lo comparte la APP —la misma portada se abre
     desde Ajustes para crear la cuenta— y ahí una segunda columna no pinta
     nada. Puesto en el marcado de la puerta, la app ni se entera.

     `js/12-login.js` lo mete dentro de `#portada` al arrancar, porque en el
     teléfono tiene que desplazarse con el formulario y no quedarse fijo
     encima. En pantalla ancha el CSS lo vuelve a sacar a la mitad derecha.

     Las DOS frases viajan siempre y el CSS enseña una: la de quien vuelve o
     la de quien llega nuevo. Esa es la mitad visible del camino partido; la
     otra mitad es con qué formulario abre la pantalla.

     Los dos párrafos de la cita nacen VACÍOS a propósito: hay un repertorio y
     se sortea una en cada apertura (`PUERTA_FRASES`, en `js/12-login.js`).
     Las viñetas sí se quedan escritas aquí, porque eso no es una frase que
     rote: es lo que hace la app. -->
<aside class="puerta-lado" id="puerta-lado">
  <div class="puerta-frase puerta-frase-vuelve">
    <p class="puerta-cita"></p>
    <p class="puerta-firma">Norata</p>
  </div>
  <div class="puerta-frase puerta-frase-nueva">
    <p class="puerta-cita"></p>
    <ul class="puerta-lista">
      <li>Misiones para hoy, que se marcan de un toque.</li>
      <li>Habilidades que suben con la práctica y bajan si las dejas.</li>
      <li>Talentos y proyectos, que se abren conforme avanzas.</li>
    </ul>
    <p class="puerta-firma">Empezar es gratis</p>
  </div>
</aside>

<!-- ============ LOS ARCHIVOS ============
     CINCO de los diecisiete que carga la app, y ni uno más. Se pudo hacer
     porque ninguno de ellos ejecuta nada al cargarse: todos son declaraciones,
     así que traerlos aquí no arranca la app por accidente.

     Lo que NO está es lo que dibuja la app —las vistas, el árbol, el resumen,
     los ajustes— y `11-arranque.js`, que es lo que la enciende. Esta pantalla
     no los necesita porque su trabajo termina en cuanto hay sesión: a partir
     de ahí manda a la raíz y es la app la que se ocupa (ver `portadaEntrada`).

     El ORDEN importa igual que en `index.html`, y `12-login.js` va el último
     porque es el que arranca. Al tocar esta lista hay que tocar también los
     ASSETS de `sw.js`. -->
<!-- La puerta también habla el idioma elegido: lo lee del espejo de
     localStorage, que es justo para lo que existe (aquí no hay `state`).
     Ninguno de los dos ejecuta nada al cargarse, que es la condición para
     poder estar aquí —ver CLAUDE.md, «No hay compilación». -->
<script defer src="../js/00-idioma.js"></script>
<script defer src="../js/00b-textos-en.js"></script>
<script defer src="../js/01-base.js"></script>
<script defer src="../js/10-sincronia.js"></script>
<script defer src="../js/10a-perfil.js"></script>
<script defer src="../js/10b-supabase.js"></script>
<script defer src="../js/10c-portada.js"></script>
<script defer src="../js/12-login.js"></script>
</body>
</html>
